name: CD

on:
  push:
    tags: ["*.*.*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Debug-signed APK: installable directly (adb install / sideload) with zero secrets to
      # manage. Good enough for internal testing; see the "deploy" job note below for what a
      # real signed release build would need.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/

      - name: Enable KVM (emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install on emulator and check for an immediate crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # android-emulator-runner runs each line of a multi-line `script:` as its own
          # separate `sh -c` call, not as one cohesive script — an inline if/then/fi here
          # gets split apart and fails with a syntax error. A real script file sidesteps that.
          script: bash .github/scripts/smoke-test.sh

  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: dist/

      - name: Rename APK with version
        run: mv dist/app-debug.apk "dist/bracelet-connecte-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bracelet-connecte-${{ github.ref_name }}.apk
          generate_release_notes: true

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Deployment placeholder
        run: |
          REF='${{ github.ref_name }}'
          SHA='${{ github.sha }}'
          REPO='${{ github.repository }}'

          echo "CD succeeded on tag ${REF} (commit ${SHA})."
          echo "APK published to the GitHub Release:"
          echo "  https://github.com/${REPO}/releases/tag/${REF}"
          echo ""
          echo "No app store deployment is configured yet."
          echo "For wider distribution later: Firebase App Distribution (invite testers by"
          echo "email, no Play Console needed) or the Play Console's internal/closed testing"
          echo "track are the natural next steps once a signing keystore is set up."
